name: CI

# checks every push and pull request: does the robot code compile, and do the tests that
# run without a robot pass

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the same Java the team builds with. Gradle 8.9 can't run on anything newer than 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile the robot code and run its tests
        run: ./gradlew :TeamCode:assembleDebug :TeamCode:testDebugUnitTest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # after the Java tests, because one of them writes the sample log these read
      - name: Test the log tools and BuzzScope
        run: |
          python3 -m unittest tools/logs/test_analyze_wpilog.py tools/logs/test_tuned.py \
            tools/buzzscope/test_log_viewer.py tools/buzzscope/test_traction.py tools/buzzscope/test_battery.py
          node --test tools/buzzscope/viewer/core.test.mjs

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: TeamCode/build/reports/tests/
